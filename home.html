<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Linx +</title>
<style>
:root{
  --bg:#05070d;
  --text:#ffffff;
  --accent:#7c5cff;
  --panel:rgba(8,11,22,.88);
  --border:rgba(255,255,255,.13);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{transition:background .35s,color .35s}

/* Detailed animated background */
.background{
  position:fixed;inset:0;z-index:-3;overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, color-mix(in srgb,var(--accent) 18%,transparent), transparent 28%),
    radial-gradient(circle at 80% 75%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 30%),
    linear-gradient(135deg,var(--bg),#03040a 55%,var(--bg));
}
.grid{
  position:absolute;inset:-50%;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(700px) rotateX(63deg) translateY(-8%);
  animation:gridMove 18s linear infinite;
}
@keyframes gridMove{to{transform:perspective(700px) rotateX(63deg) translateY(8%)}}
.noise{
  position:absolute;inset:0;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.18;animation:float 12s ease-in-out infinite}
.orb.one{width:340px;height:340px;background:var(--accent);left:-100px;top:8%}
.orb.two{width:300px;height:300px;background:#00d9ff;right:-80px;bottom:0;animation-delay:-5s}
@keyframes float{50%{transform:translate(80px,-45px) scale(1.12)}}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.012) 6px);pointer-events:none}

/* Main hero */
.hero{height:100%;display:grid;place-items:center;text-align:center;padding:30px}
.badge{
  display:inline-block;padding:8px 14px;border:1px solid var(--border);
  border-radius:999px;background:rgba(255,255,255,.04);backdrop-filter:blur(12px);
  letter-spacing:4px;font-size:11px;text-transform:uppercase;margin-bottom:25px;
}
.logo{
  margin:0;font-size:clamp(58px,10vw,145px);font-weight:950;letter-spacing:-7px;
  line-height:.9;text-transform:uppercase;
  color:var(--text);
  text-shadow:0 0 30px color-mix(in srgb,var(--accent) 50%,transparent),0 0 90px color-mix(in srgb,var(--accent) 22%,transparent);
}
.logo .plus{
  color:var(--accent);
  text-shadow:0 0 28px var(--accent);
  display:inline-block;
  animation:plusPulse 2.8s ease-in-out infinite;
  transform-origin:center;
}
@keyframes plusPulse{
  0%,100%{opacity:1;transform:scale(1);filter:brightness(1)}
  38%{opacity:.28;transform:scale(.94);filter:brightness(.72)}
  50%{opacity:1;transform:scale(1.03);filter:brightness(1.35)}
  62%{opacity:.48;transform:scale(.97);filter:brightness(.85)}
}
.typing{
  min-height:42px;margin:30px auto 0;max-width:900px;
  font-size:clamp(16px,2.2vw,25px);letter-spacing:7px;font-weight:800;
  text-transform:uppercase;color:var(--text);opacity:.8;
}
.cursor{display:inline-block;width:3px;height:1em;background:var(--accent);margin-left:5px;vertical-align:-2px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.hint{margin-top:30px;font-size:12px;letter-spacing:2px;opacity:.45}
kbd{border:1px solid var(--border);padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06)}

/* Menus */
.menu{
  position:fixed;top:0;bottom:0;width:min(350px,86vw);padding:28px;
  background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:20;
}
.left{left:0;transform:translateX(-105%);border-left:0}
.right{right:0;transform:translateX(105%);border-right:0}
.left.open{transform:translateX(0)}
.right.open{transform:translateX(0)}
.menu h2{margin:0 0 8px;font-size:26px}
.menu p{font-size:12px;opacity:.5;margin:0 0 25px}
.slots{display:grid;gap:9px}
.slot{
  width:100%;border:1px solid var(--border);background:rgba(255,255,255,.035);
  color:var(--text);padding:14px 15px;border-radius:12px;text-align:left;
  cursor:pointer;font-weight:700;transition:.2s;
}
.slot:hover{border-color:var(--accent);transform:translateX(4px);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.close{position:absolute;right:20px;top:20px;border:0;background:none;color:var(--text);font-size:24px;cursor:pointer}

.setting{margin:0 0 21px}
.setting label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;opacity:.7}
input[type=text]{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.06);color:var(--text);outline:none}
input[type=color]{width:100%;height:45px;padding:3px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.06);cursor:pointer}
.action{
  width:100%;padding:13px;border:1px solid var(--accent);border-radius:10px;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text);
  font-weight:800;cursor:pointer;margin-top:5px
}
.small{font-size:11px;opacity:.45;line-height:1.5;margin-top:9px}

/* Mobile helper */
@media(max-width:600px){
  .logo{letter-spacing:-4px}
  .typing{letter-spacing:3px}
}
</style>
</head>
<body>
<div class="background">
  <div class="grid"></div><div class="noise"></div>
  <div class="orb one"></div><div class="orb two"></div><div class="scanlines"></div>
</div>

<aside class="menu left" id="leftMenu">
  <button class="close" onclick="toggleLeft()">×</button>
  <h2>Hero Linx +</h2>
  <p>Navigation // 10 slots</p>
  <div class="slots">
    <button class="slot" onclick="go('page1.html')">Kahoot Cover</button>
    <button class="slot" onclick="go('http://kahootgames.bot.nu/')">Linx Games</button>
    <button class="slot" onclick="go('kahootgust.bot.nu')">Linx Proxy</button>
    <button class="slot" onclick="go('kahootluma.bot.nu')">Luma Games</button>
    <button class="slot" onclick="go('page5.html')">05 — Page Five</button>
    <button class="slot" onclick="go('page6.html')">06 — Page Six</button>
    <button class="slot" onclick="go('page7.html')">07 — Page Seven</button>
    <button class="slot" onclick="go('page8.html')">08 — Page Eight</button>
    <button class="slot" onclick="go('page9.html')">09 — Page Nine</button>
    <button class="slot" onclick="go('page10.html')">10 — Page Ten</button>
  </div>
</aside>

<aside class="menu right" id="rightMenu">
  <button class="close" onclick="toggleRight()">×</button>
  <h2>Settings</h2>
  <p>Customize your Hero Linx + experience.</p>

  <div class="setting">
    <label for="titleInput">Title</label>
    <input id="titleInput" type="text" placeholder="Type a tab title..." oninput="setTitle(this.value)">
  </div>

  <div class="setting">
    <label for="bgColor">Background Color</label>
    <input id="bgColor" type="color" value="#05070d" onchange="setColor('--bg',this.value)">
  </div>

  <div class="setting">
    <label for="wordColor">Word Color</label>
    <input id="wordColor" type="color" value="#ffffff" onchange="setColor('--text',this.value)">
  </div>

  <div class="setting">
    <label for="accentColor">Accent Color</label>
    <input id="accentColor" type="color" value="#7c5cff" onchange="setColor('--accent',this.value)">
  </div>

  <button class="action" onclick="cloak()">Cloak → Open in New Tab</button>
  <div class="small">Cloak opens a new about:blank tab and recreates the current Hero Linx + page inside it, including your current settings and animation.</div>
</aside>

<main class="hero">
  <div>
    <h1 class="logo">HERO LINX <span class="plus">+</span></h1>
    <div class="typing"><span id="typed"></span><span class="cursor"></span></div>
    <div class="hint"><kbd>E</kbd> NAVIGATION &nbsp;&nbsp; <kbd>R</kbd> SETTINGS</div>
  </div>
</main>

<script>
const phrases = [
  "BUILD SOMETHING LEGENDARY",
  "CREATE WITHOUT LIMITS",
  "YOUR WEB. YOUR RULES.",
  "WELCOME TO HERO LINX +"
];
let phraseIndex=0, charIndex=0, deleting=false;

function typeLoop(){
  const el=document.getElementById("typed");
  const phrase=phrases[phraseIndex];
  if(!deleting){
    charIndex++;
    el.textContent=phrase.slice(0,charIndex);
    if(charIndex===phrase.length){
      deleting=true;
      setTimeout(typeLoop,2100);
      return;
    }
    setTimeout(typeLoop,145);
  }else{
    charIndex--;
    el.textContent=phrase.slice(0,charIndex);
    if(charIndex===0){
      deleting=false;
      phraseIndex=(phraseIndex+1)%phrases.length;
      setTimeout(typeLoop,850);
      return;
    }
    setTimeout(typeLoop,105);
  }
}
typeLoop();

function toggleLeft(){document.getElementById("leftMenu").classList.toggle("open");}
function toggleRight(){document.getElementById("rightMenu").classList.toggle("open");}
function go(page){ if(page!=="page1.html") location.href=page; else location.href="index.html"; }

document.addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="e" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) toggleLeft();
  if(e.key.toLowerCase()==="r" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) toggleRight();
  if(e.key==="Escape"){
    document.getElementById("leftMenu").classList.remove("open");
    document.getElementById("rightMenu").classList.remove("open");
  }
});

function setTitle(value){
  document.title=value.trim() || "Hero Linx +";
  localStorage.setItem("heroTitle",document.title);
}
function setColor(variable,value){
  document.documentElement.style.setProperty(variable,value);
  localStorage.setItem(variable,value);
}
function loadSettings(){
  const title=localStorage.getItem("heroTitle");
  if(title){document.title=title;document.getElementById("titleInput").value=title;}
  ["--bg","--text","--accent"].forEach(v=>{
    const value=localStorage.getItem(v);
    if(value){
      document.documentElement.style.setProperty(v,value);
      const id=v==="--bg"?"bgColor":v==="--text"?"wordColor":"accentColor";
      document.getElementById(id).value=value;
    }
  });
}
loadSettings();

function cloak(){
  const newTab=window.open("about:blank","_blank");
  if(!newTab){alert("Your browser blocked the new tab. Allow pop-ups for this site, then try again.");return;}
  const source="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  newTab.document.open();
  newTab.document.write(source);
  newTab.document.close();
}
</script>
</body>
</html>
